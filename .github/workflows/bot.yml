name: YouTube Live Questions Monitor

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: youtube-live-questions-monitor
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y pytchat pytchat-ng || true
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip show pytchat-ng
          
      - name: Verify dependencies
        run: |
          python -m pip show pytchat-ng
          python -c "import pytchat; print('pytchat import successful')"

      - name: Run Bot
        env:
          PYTHONUNBUFFERED: '1'
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CHANNEL_HANDLE: ${{ secrets.YOUTUBE_CHANNEL_HANDLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          CHECK_INTERVAL_SECONDS: '120'
          MAX_RUNTIME_SECONDS: '17400'
        run: python -u main.py
